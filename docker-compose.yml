services:
  postgres:
    image: postgres:17-alpine
    container_name: noname-crm-postgres
    environment:
      POSTGRES_USER: noname
      POSTGRES_PASSWORD: noname
      POSTGRES_DB: noname_crm
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noname -d noname_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
